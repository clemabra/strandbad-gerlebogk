# Cloudflare Pages-Konfiguration.
#
# Das send_email-Binding fürs Anfrageformular (/functions/api/anfrage.js)
# steht bewusst NICHT hier drin: Pages-Projekte lehnen "send_email" in der
# wrangler.toml ab ("Configuration file for Pages projects does not support
# send_email"). Das Binding muss stattdessen im Cloudflare-Dashboard gesetzt
# werden unter Workers & Pages → Projekt → Settings → Functions →
# "Email Bindings" → Binding-Name "ANFRAGE_MAIL", Zieladresse
# fischerparty@web.de. Genaue Schritte stehen in der README unter
# "Anfrageformular einrichten".

name = "strandbad-gerlebogk"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
