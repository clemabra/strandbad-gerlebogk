# Cloudflare Worker-Konfiguration für strandbad-gerlebogk.de.
#
# Dieses Projekt läuft als "echter" Worker mit statischen Assets (nicht als
# klassisches Pages-Projekt) – das Cloudflare-Onboarding hat es beim Anlegen
# so erstellt. "wrangler pages deploy" schlägt hier fehl (kein Pages-Projekt
# vorhanden); der richtige Befehl ist "npx wrangler deploy".
#
# [assets] liefert die statische Seite aus (Repo-Root, siehe .assetsignore
# für ausgeschlossene Dateien). worker/index.js behandelt zusätzlich die
# eine dynamische Route POST /api/anfrage fürs Kontaktformular und reicht
# alles andere unverändert an ASSETS weiter.
#
# send_email-Binding: bei einem Worker-Projekt (anders als bei Pages) direkt
# hier deklarierbar, kein Dashboard-Umweg nötig.

name = "strandbad-gerlebogk"
main = "worker/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "."
binding = "ASSETS"

[[send_email]]
name = "ANFRAGE_MAIL"
destination_address = "fischerparty@web.de"
