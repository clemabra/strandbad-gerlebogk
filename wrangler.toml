# Cloudflare Pages-Konfiguration für das Anfrageformular (/functions/api/anfrage.js).
#
# Deklariert das send_email-Binding für den Versand über Cloudflare Email
# Routing. Falls Cloudflare Pages diese Datei bei euch nicht automatisch
# aufgreift: dasselbe Binding lässt sich im Cloudflare-Dashboard unter
# Workers & Pages → Projekt → Settings → Functions → "Email Bindings"
# manuell mit identischem Namen ("ANFRAGE_MAIL") und derselben Zieladresse
# anlegen. Genaue Schritte stehen in der README unter "Anfrageformular
# einrichten".

name = "strandbad-gerlebogk"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[send_email]]
name = "ANFRAGE_MAIL"
destination_address = "fischerparty@web.de"
